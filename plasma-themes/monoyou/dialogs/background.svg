  <text xml:space="preserve" style="font-stretch:condensed;font-size:1.25217px;font-family:Impact;-inkscape-font-specification:'Impact Condensed';text-align:start;text-anchor:start;fill:#ff0000;stroke:#000000;stroke-width:5.72866;stroke-linecap:round" x="118" y="1.9579086" id="text1204">
    <tspan sodipodi:role="line" id="tspan1202" x="118" y="1.9579086" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866">The corners of the mask are 1px  smaller because they</tspan>
    <tspan sodipodi:role="line" x="118" y="3.6373291" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1358">are not antialiased, whereas the svg corners are; if the</tspan>
    <tspan sodipodi:role="line" x="118" y="5.3167458" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1360">mask is the same size of the svg, then, some of the corner</tspan>
    <tspan sodipodi:role="line" x="118" y="6.9961662" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1362">pixels of the mask will be visible even though they should</tspan>
    <tspan sodipodi:role="line" x="118" y="8.6755867" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1364">be covered by the svg.</tspan>
  </text>
